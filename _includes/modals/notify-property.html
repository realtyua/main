<div class="modal fade" id="notifyModal" tabindex="-1" role="dialog" aria-labelledby="notifyModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="notifyModalLabel">{{ site.data.uk.notify_modal_title }}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="{{ site.data.uk.close }}">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p class="lead">{{ site.data.uk.notify_modal_lead }}</p>
        {%- include form/app/notify.html -%}
        {%- capture notify_page_json -%}
          {"uid": {{ page.uid | jsonify }}, "property_url": {{ page.url | absolute_url | jsonify | replace: '</', '<\/' }}, "property_email": {{ page.email | jsonify }}, "property_title": {{ page.title | jsonify | replace: '</', '<\/' }}}
        {%- endcapture -%}
        <script id="notify-page" type="application/json">{{ notify_page_json }}</script>
      </div>
    </div>
  </div>
</div>
