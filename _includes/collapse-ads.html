{%- assign ads = site.data._ads_pages -%}
{%- if ads[0] -%}
  {%- for ad in ads -%}
  <div class="col mb-3 mb-md-0">
    <div class="card h-100">
      <div class="card-body">
        <p class="card-text"><a href="{{ ad.url }}">{{ ad.subtitle }}</a></p>
      </div>
    </div>
  </div>
  {%- endfor -%}
{%- endif -%}
