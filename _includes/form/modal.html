{% assign addon_modal = include.modal %}
<div class="modal fade realestate" id="{{ include.modal_id }}" tabindex="-1" role="dialog" aria-labelledby="{{ include.modal_id }}Label" aria-hidden="true">
  <div class="modal-dialog{% if addon_modal.size %} modal-{{ addon_modal.size }}{% endif %}">
    <div class="modal-content text-white net-realestate">
      <div class="modal-header border-0">
        <h5 class="modal-title pl-2" id="{{ include.modal_id }}Label">{{ addon_modal.title }}</h5>
        <button type="button" class="close py-1 px-2" data-dismiss="modal" aria-label="Close" title="{{ site.data.uk.close }}">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body pt-0 pb-4 px-4">{% if addon_modal.markdown %}{{ addon_modal.body | markdownify }}{% else %}{{ addon_modal.body }}{% endif %}</div>
    </div>
  </div>
</div>
