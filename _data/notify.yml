version: 1
id: notify
theme: bootstrap4

behavior:
  mode: modal
  modal: "#notifyModal"

settings:
  title: Повідомити про неточність - settings.title
  description: |
    Якщо ви помітили, що оголошення містить неточну інформацію або вже не актуальне, будь ласка, повідомте нам про це...
  feedback:
    valid: Виглядає наче все добре!
    invalid: Будь ласка, заповніть це поле дійсними даними
    pattern: Тільки українські літери, цифри та розділові знаки
    email: Введіть коректну електронну пошту
  required:
    marker: '&#9728;'
    tooltip: Це поле є обов’язкове
    message: Будь ласка, заповніть це поле
    class: text-danger small font-weight-bold
  #submit:
  #  action: "{{ site.notify_endpoint }}"
  #  method: POST

steps:
  - id: form
    title: Повідомити про неточність в оголошенні - steps.title
    rows:
      - class: row
        cols:
          - class: col-12
            rows:
              - class: row
                fields:
                  - name: honeypot_hint
                    type: raw
                    html: |-
                      <div class="sr-only" aria-hidden="true" style="position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden;">
                        <label for="notify-honeypot">Leave this field empty</label>
                        <input type="text" id="notify-honeypot" name="honeypot" tabindex="-1" autocomplete="off" value="" spellcheck="false">
                      </div>
                  - name: timestamp
                    type: hidden
                  - name: uid
                    type: hidden
                  - name: property_url
                    type: hidden
                  - name: property_email
                    type: hidden
                  - name: property_title
                    type: hidden

              - class: row
                fields:
                  - name: reason
                    type: select
                    required: true
                    label: Причина повідомлення
                    placeholder: Оберіть причину
                    autocomplete: "off"
                    feedback:
                      valid: Причину обрано
                      invalid: Оберіть причину
                    validation:
                      required: Оберіть причину
                    options:
                      - value: not_actual
                        label: "Оголошення вже не актуальне (продано/здано)"
                      - value: moved_to_archive
                        label: Помилково переміщено в архів
                      - value: wrong_price
                        label: Ціна вказана неправильно
                      - value: wrong_info
                        label: Інформація в описі неточна
                      - value: error
                        label: "Помилка в оголошенні (адреса, контакти тощо)"
                      - value: duplicate
                        label: Це дублікат іншого оголошення
                      - value: other
                        label: "Інше (напишіть нижче)"

              - class: row
                fields:
                  - name: details
                    type: textarea
                    label: Опис проблеми
                    helper: Напишіть тут що не так з цією нерухомістю
                    minlength: 0
                    maxlength: 256
                    placeholder: "Опишіть, що саме не так з оголошенням..."
                    autogenerate: false
                    spellcheck: false
                    feedback:
                      valid: Текст введено правильно
                      invalid: Тільки українська кирилиця, цифри, пробіли та розділові знаки
                    validation:
                      pattern: Тільки українська кирилиця, цифри, пробіли та розділові знаки

              - class: row
                fields:
                  - name: contact_name
                    type: text
                    label: Ім’я
                    required: true
                    placeholder: Тарас
                    autocomplete: given-name
                    col: col-12 col-md-4
                    pattern: ^[а-щА-ЩЬьЮюЯяЇїІіЄєҐґ']{2,30}$
                    minlength: 2
                    maxlength: 30
                    validation:
                      required: Будь ласка вкажіть ім’я українською
                      minlength: Це поле має містити щонайменше 2 символи.
                      maxlength: Це поле маже містити не більше 30 символів.
                      pattern: Це поле має містити ім’я українською, на зразок цього "Ян", "Федір" або "Петро".

                  - name: contact_phone
                    type: tel
                    label: Телефон
                    required: true
                    placeholder: "504949649"
                    prepend: "+380"
                    pattern: ^([1-9]{1})([0-9]{1})([0-9]{7})$
                    minlength: 9
                    maxlength: 9
                    col: col-12 col-md-4
                    validation:
                      required: Будь ласка вкажіть номер телефону у цифровому форматі
                      pattern: Невірний формат телефону
                      minlength: Це поле має містити номер телефону у цифровому форматі і щонайменше 9 цифр.
                      maxlength: Це поле має містити номер телефону у цифровому форматі і не більше 9 цифр.
                    autocomplete: "off"

                  - name: contact_email
                    type: email
                    label: Електронна пошта
                    required: false
                    placeholder: "my@email.domain.ua"
                    pattern: ^(?!.*@.*\.(ru|su|рф|xn--p1ai|cn|ir)$).+@.+\..+$
                    minlength: 3
                    maxlength: 254
                    col: col-12 col-md-4
                    validation:
                      required: Вкажіть електронну пошту
                      minlength: Електронна пошта має містити щонайменше 3 символи
                      maxlength: Електронна пошта не може містити більше 254 символів
                      pattern: Не правильний формат електронної пошт
                      dnscheck:
                        value: true
                        message: Домен не приймає пошту або не існує
                    autocomplete: "off"

              - class: row
                fields:
                  - name: captcha
                    type: widgets
                    widget: captcha
                    element_id: captcha
                    action: notify_property
                    token: cf-turnstile-response
                    required: true
                    class: col-12
                    label: Підтвердьте, що ви не робот
                    theme: light
                    size: normal
                    appearance: always
                    validation:
                      required: Підтвердьте, що ви не робот
                    helper: Якщо перевірка не з’явилася, натисніть «Спробувати ще раз».

              - class: row
                fields:
                  - name: notify_error_block
                    type: raw
                    html: |-
                      <div id="notify-error" class="alert alert-danger d-none" role="alert">
                        На жаль, сталася помилка. Спробуйте ще раз пізніше.
                      </div>

                  - name: notify_success_block
                    type: raw
                    html: |-
                      <div id="notify-success" class="d-none">
                        <div class="alert alert-success" role="alert">
                          <strong>Дякуємо за повідомлення!</strong> Ваше повідомлення отримано. Ми перевіримо оголошення найближчим часом.
                        </div>
                      </div>

              - class: row
                fields:
                  - name: notify_submit
                    type: raw
                    html: '<button type="submit" id="notify-submit" class="btn btn-primary" data-form-action="submit"><span data-submit-label>Надіслати</span><span data-submit-busy hidden>Надсилаю<span class="spinner-border spinner-border-sm ml-2" role="status"><span class="sr-only">Надсилаю...</span></span></span></button>'