  - id: contact
    title: Контакти та медіа
    class: h4 text-primary text-left
    rows:
      - class: row
        cols:
          - class: col-12
            rows:
              - class: row
                fields:
                  - name: first_name
                    type: text
                    label: Ім'я
                    required: true
                    placeholder: Тарас
                    autocomplete: given-name
                    col: col-12 col-md-6
                    minlength: 2
                    maxlength: 30
                    validation:
                      required: Будь ласка вкажіть ім'я українською
                      minlength: Це поле має містити щонайменше 2 символи.
                      maxlength: Це поле маже містити не більше 30 символів.
                      pattern: Це поле має містити ім'я українською, на зразок цього "Ян", "Федір" або "Петро".

                  - name: last_name
                    type: text
                    label: Прізвище
                    required: true
                    placeholder: Шевченко
                    autocomplete: family-name
                    col: col-12 col-md-6
                    minlength: 3
                    maxlength: 30
                    validation:
                      required: Будь ласка вкажіть прізвище українською
                      minlength: Це поле має містити щонайменше 3 символи.
                      maxlength: Це поле маже містити не більше 30 символів.
                      pattern: Це поле має містити прізвище українською, на зразок цього "Бандера" або "Вуж" чи "Ґут-Кульчицький".

              - class: row
                fields:
                  - name: phone
                    type: tel
                    label: Телефон
                    required: true
                    placeholder: "504949649"
                    prepend: "+380"
                    pattern: '^([1-9]{1})([0-9]{1})([0-9]{7})$'
                    minlength: 9
                    maxlength: 9
                    autocomplete: tel
                    col: col-12 col-md-6
                    validation:
                      required: Будь ласка вкажіть номер телефону у цифровому форматі
                      pattern: Невірний формат телефону
                      minlength: Це поле має містити номер телефону у цифровому форматі і щонайменше 9 цифр.
                      maxlength: Це поле має містити номер телефону у цифровому форматі і не більше 9 цифр.

                  - name: email
                    type: email
                    label: Електронна пошта
                    required: false
                    placeholder: "my@email.domain.ua"
                    pattern: '^(?!.*@.*\.(ru|su|рф|xn--p1ai|cn|ir)$).+@.+\..+$'
                    minlength: 3
                    maxlength: 254
                    col: col-12 col-md-6
                    validation:
                      required: Вкажіть електронну пошту
                      minlength: Електронна пошта має містити щонайменше 3 символи
                      maxlength: Електронна пошта не може містити більше 254 символів
                      dnscheck:
                        value: true
                        message: Домен не приймає пошту або не існує
                    autocomplete: "off"

              - class: row
                fields:
                  - name: description
                    type: textarea
                    label: Опис оголошення
                    helper: Напишіть тут щось особливе про вашу нерухомість
                    minlength: 0
                    maxlength: 500
                    placeholder: Опишіть вашу нерухомість...
                    autogenerate: false

              - class: row
                fields:
                  - name: images
                    type: file
                    label: Фотознимки об'єкта нерухомості
                    multiple: true
                    required: true
                    accept: image/*
                    file:
                      minFiles: 1
                      maxFiles: 4
                      maxSize: 150KB
                      infoLine: "Ви можете додати фотознімки об'єкта нерухомості: від {min} до {max} файлів, до {limit} в однму файлі"
                      thumbWidth: 140
                      thumbHeight: 105
                      resizeWidth: 800
                      resizeHeight: 600
                      cropOrigin: top-left
                      formatName: true
                      ext: jpg
                      infoMessage: "Додані фотознимки перевищують встановлені ліміти, а саме розмір зображення {size} і кілкьість кілобайт у файлі {limit}. Система автоматично змінить розміри фотознимків до {size} та стисне файли до {limit} і вони будуть у межах ліміту. Якщо ви хочете зроити це самостійно, будь ласка оберіть інші файли."
                    helper: "Додайте максимум чотири широкоформатних фото не більше 5-ти мегабайт, до прикладу: загальне фото об'єкту нерухомості, вітальні чи спальні, кухні та кімнати особистої гігієни. Приклад доброго та поганого фото."

              - class: row
                fields:
                  - name: agree
                    type: checkbox
                    label: Я ознайомився та погоджуюсь з Правилами публікації оголошень
                    required: true