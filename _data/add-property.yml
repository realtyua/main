                    autocomplete: "off"
                    mode: auto
                    threshold: 5
                    minChars: 2
                    maxResults: 6
                    data:
                      - value: alley
                        label: алея
                      - value: boulevard
                        label: бульвар
                      - value: street
                        label: вулиця
                      - value: road
                        label: дорога
                      - value: line
                        label: лінія
                      - value: maidan
                        label: майдан
                      - value: riverside
                        label: набережна
                      - value: lane
                        label: провулок
                      - value: passage
                        label: проїзд
                      - value: prospectus
                        label: проспект
                      - value: hamlet
                        label: присілок
                      - value: deadend
                        label: тупик
                      - value: uzviz
                        label: узвіз
                      - value: tractofland
                        label: урочище
