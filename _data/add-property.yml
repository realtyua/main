                        minChars: 2
                        maxResults: 6
                        value:
                          default:
                            value: ["0342"]
                            readonly: true
                      raion:
                        label: Район
                        placeholder: Виберіть район...
                        required: true
                        message: Виберіть район
                        mode: auto
                        threshold: 6
                        minChars: 2
                        maxResults: 6
                      hromada:
                        label: Територіальна громада
                        placeholder: Введіть назву громади...
                        required: true
                        message: Виберіть громаду
                        mode: auto
                        threshold: 6
                        minChars: 3
                      settlement:
                        label: Населений пункт
                        placeholder: Введіть назву...
                        required: true
                        #message: Виберіть населений пункт
                        mode: auto
                        threshold: 6
                        minChars: 2
                        maxResults: 6
                        feedback:
                          valid: Виглядає наче у полі Населений пункт все добре!
                          invalid: Будь ласка, заповніть це поле дійсними даними
                          pattern: Тільки українські літери...
                        helper: Введіть перші три українські літери у назві населеного пункту

              - class: row
