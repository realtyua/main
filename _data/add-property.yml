                    placeholder: Введіть назву мікрорайону...
                    datas:
                      - field: settlement
                        value: "30595"
                        data: /assets/data/districts.json
                        mode: search
                        threshold: 6
                        minChars: 2
                        maxResults: 6
                      - field: settlement
                        value: "30559"
                        data: /assets/data/districts-30559.json
                        mode: auto
                        minChars: 2
                        maxResults: 6
                    required: false
                    #message: Введіть перші три українські літери у назві мікрорайону міста і виберіть ваш мікрорайон. Довідома, ці мікрорайони не є офіційним аміністративним поділом міста, то ж це поле не є обов'язковим
                    validation:
                      required: Виберіть район населеного пункту
                    depends:
                      - field: settlement
                        values: ["30595","30559"]
