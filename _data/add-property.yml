settings:
  title: Подання оголошення про нерухомість
  description: |
    Заповніть форму нижче, щоб додати ваше оголошення.
    Будь ласка, будьте уважні, заповнюючи форму дійсними даними.
  feedback:
    valid: Виглядає наче все добре!
    invalid: Будь ласка, заповніть це поле дійсними даними
    pattern: Тільки українські літери, цифри та розділові знаки
  required:
    marker: '&#9728;'
    tooltip: Це поле є обов'язкове
    message: Будь ласка, заповніть це поле
    class: h6
  pattern: '^[а-яА-ЯієїґІЄЇҐ0-9\s.,:;!?\(\)«»№+\/–—\-]+$'

steps:
  - id: start
    title: Узгодження
    class: h4 text-primary text-left
    rows:
      - class: row
        cols:
          - class: col-12
            rows:
              - class: row
                fields:
                  - name: start_alert_info
                    type: alert
                    variant: info
                    label: "Якщо ви вже прочитали <b>правила і умови</b>, тоді вам залишається погодитись і прийняти та розпочати заповнювати форму даними про нерухомість та надіслати ваше оголошення нам."
                    col: col-12
                    depends:
                      - field: agree_rules
                        values: [false]

              - class: row
                fields:
                  - name: start_alert_warning
                    type: alert
                    variant: warning
                    label: Перш ніж додати оголошення перевірте можлво це оголошення вже присутнє у нашому каталозі. Натисність зелену кнопку <b>Пошук</b> у верхній частині сторінки і виберіть опцію <b>Пошук в оголошеннях</b>.
                    col: col-12
                    depends:
                      - field: agree_rules
                        values: [true]

              - class: row
                fields:
                  - name: agree_rules
                    required: true
                    type: checkbox
                    label:
                      text: Так, я погоджуюсь з [правилами і умовами використання](/terms-and-conditions.html)
                      markdown: true
                    helper: Ознайомтесь з <a href="/terms-and-conditions.html">правилами і умовами</a> використання і приміть рішення.
                    feedback:
                      valid: Ви погодилися з правилами і умовами використання і можете додати оголошення.
                      invalid: Якщо не погодитесь з правилами і умовами використання, то не зможете додати оголошення.

  - id: type
    title: Характеристики
    class: h4 text-primary text-left
    rows:
      - class: row
        cols:
          - class: col-12
            rows:
              - class: row
                fields:
                  - name: action_type
                    type: select
                    label: Тип вашої дії
                    required: true
                    placeholder: Оберіть дію...
                    col: col-12 col-md-6
                    validation:
                      required: Будь ласка, оберіть дію
                    options:
                      - value: sell
                        label: Продаю
                      - value: rent
                        label: Передаю в оренду
                      - value: realty_free
                        label: Віддам безкоштовно
                      - value: rent_free
                        label: В оренду безкоштовно
                    feedback:
                      valid: Ви обрали дію і тут наче все гаразд.
                      invalid: Ви не вибрали дію, будь ласка виберіть дію.
                    helper: Вкажіть дію яку чините з нерухомстю

                  - name: property_type
                    type: select
                    label: Вид нерухомості
                    required: true
                    placeholder: Оберіть вид...
                    col: col-12 col-md-6
                    validation:
                      required: Будь ласка, оберіть вид нерухомості
                    options:
                      - value: apartment
                        label: Квартира
                      - value: apartment_part
                        label: Частина квартири
                      - value: house
                        label: Будинок
                      - value: house_part
                        label: Частина будинку
                      - value: room
                        label: Кімната
                      - value: commercial
                        label: Нежитлове приміщення
                      - value: land
                        label: Земля
                      - value: garage
                        label: Гараж
                    helper: Виберіть тут те що продаєте чи передаєте в оренду.

              - class: row
                fields:
                  - name: has_land
                    type: checkbox
                    label: У цієї нерухомості є земля
                    col: col-12
                    depends:
                      - field: property_type
                        values: [apartment, apartment_part, room, commercial, garage]

              - class: row
                auto: true
                fields:
                  - name: rooms
                    required: true
                    type: number
                    label:
                      text: Кількість кімнат
                      depends:
                        - field: property_type
                          values: [commercial, garage]
                          text: Кількість приміщень
                    min: 1
                    max: 99
                    value:
                      default:
                        value: ''
                        readonly: false
                      depends:
                        - field: property_type
                          values: [room, garage]
                          value: 1
                          readonly: true
                    col: col-12 col-md-4
                    validation:
                      required:
                        text: Вкажіть кількість кімнат
                        depends:
                          - field: property_type
                            values: [commercial, garage]
                            text: Вкажіть кількість приміщень
                      min:
                        text: Мінімум 1 кімната
                        depends:
                          - field: property_type
                            values: [commercial]
                            text: Мінімум 5 приміщень
                      max:
                        text: Максимум 99 кімнат
                        depends:
                          - field: property_type
                            values: [commercial]
                            text: Максимум 500 приміщень
                    depends:
                      - field: property_type
                        except: [land]

                  - name: floor
                    type: number
                    required: true
                    label: Поверх
                    placeholder: 0 це підвал
                    min: 0
                    max: 35
                    col: col-6 col-md-4
                    validation:
                      compare:
                        - field: floors
                          operator: '<='
                          message: "Поверх не може бути більше за поверховість будинку"
                      min: 0 це підвал
                      max: Найвища споруда в Україні має 65 поврехів
                    depends:
                      - field: property_type
                        except: [land]

                  - name: floors
                    type: number
                    required: true
                    label: Поверхів в будинку
                    min: 1
                    max: 65
                    col: col-6 col-md-4
                    validation:
                      compare:
                        - field: floor
                          operator: '>='
                          message: "Поверховість не може бути меншою за поверх"
                      min: У будинку як мініму 1 поврех
                      max: Найвища споруда в Україні має 65 поверхів
                    depends:
                      - field: property_type
                        except: [land]

              - class: row
                fields:
                  - name: surface_paragraph
                    type: paragraph
                    class: font-weight-bold
                    label:
                      text: "Площа об'єкта нерухомсті в м²"
                      depends:
                        - field: property_type
                          values: [apartment]
                          text: Площа квартири в м²
                        - field: property_type
                          values: [apartment_part]
                          text: Площа частини квартири в м²
                        - field: property_type
                          values: [house]
                          text: Площа будинку в м²
                        - field: property_type
                          values: [house_part]
                          text: Площа частини будинку в м²
                        - field: property_type
                          values: [commercial]
                          text: Площа нежитлового приміщення в м²
                    col: col-12
                    depends:
                      - field: property_type
                        values: [apartment, apartment_part, house, house_part, commercial]

              - class: row
                auto: true
                fields:
                  - name: surface
                    required: true
                    type: number
                    col: col col-md-4
                    label:
                      text: Загальна
                      depends:
                        - field: property_type
                          values: [room]
                          text: Площа кімнати в м²
                        - field: property_type
                          values: [garage]
                          text: Площа гаража в м²
                    min: 2.00
                    append:
                      button:
                        label: "<small><b>м<sup>2</sup></b></small>"
                        variant: primary
                        title: Інформаційна довідка
                        modal:
                          title: Про метричні величини
                          body: |
                            <dl>
                              <dt>Один метр (м)</dt>
                              <dd>Це 1000 мм або 100 см</dd>
                              <dt>Один метр квадратний (<small>м<sup>2</sup></small>)</dt>
                              <dd>Це площа квадрата зі стороною один метр (1 м х 1 м)</dd>
                            </dl>
                            <p><b>Приклад</b>: Якщо ви хочете визначити кількість метрів квадратних кімнати у квартирі чи у будинку вам необхідно виміряти дві стіни, які мають спільний кут, одна стіна буде довжиною, а друга шириною. Отримані показники множите, в результаті чого ви отримаєте кількість метрів квадратних кімнати. Тим же способом вимірюєте інші приміщення у вашому об'єкті нерухомості, потім сумуєте (додаєте) всі отримані показники в результаті чого ви отримаєте загальну кількість метрів квадратних площі вашої квартири, будинку чи іншого об'єкта нерухомості. Ви також можете відкрити свої документи на нерухомість і додати всі показники вказані на схематичному плані об'єкта нерухомості.</p>
                    depends:
                      - field: property_type
                        values: [apartment, apartment_part, house, house_part, room, commercial]
                    validation:
                      min: Мінімальні кількість це 2 м²
                      compare:
                        - field: [surface_live, surface_kitchen, surface_bathroom, surface_corridor, surface_othre]
                          operator: '>='
                          message: "Загальна площа не може бути меншою за сумарну площу всіх частин об'єкта нерухомості"

                  - name: surface_live
                    type: number
                    col: col-6 col-md-4
                    label: Житлова
                    min: 6.00
                    append:
                      button:
                        label: "<small><b>м<sup>2</sup></b></small>"
                        variant: primary
                        title: Інформаційна довідка
                        modal:
                          title: Про метричні величини
                          body: |
                            <dl>
                              <dt>Один метр (м)</dt>
                              <dd>Це 1000 мм або 100 см</dd>
                              <dt>Один метр квадратний (<small>м<sup>2</sup></small>)</dt>
                              <dd>Це площа квадрата зі стороною один метр (1 м х 1 м)</dd>
                            </dl>
                            <p><b>Приклад</b>: Якщо ви хочете визначити кількість метрів квадратних житлової кімнати у квартирі чи у будинку вам необхідно виміряти дві стіни, які мають спільний кут, одна стіна буде довжиною, а друга шириною. Отримані показники множите, в результаті чого ви отримаєте кількість метрів квадратних житлової кімнати.</p>
                    depends:
                      - field: property_type
                        values: [apartment, apartment_part, house, house_part]

                  - name: surface_kitchen
                    type: number
                    col: col-6 col-md-4
                    label: Кухня
                    min: 4.00
                    append:
                      button:
                        label: "<small><b>м<sup>2</sup></b></small>"
                        variant: primary
                        title: Інформаційна довідка
                        modal:
                          title: Про метричні величини
                          body: |
                            <dl>
                              <dt>Один метр (м)</dt>
                              <dd>Це 1000 мм або 100 см</dd>
                              <dt>Один метр квадратний (<small>м<sup>2</sup></small>)</dt>
                              <dd>Це площа квадрата зі стороною один метр (1 м х 1 м)</dd>
                            </dl>
                            <p><b>Приклад</b>: Якщо ви хочете визначити кількість метрів квадратних кухні у квартирі чи у будинку вам необхідно виміряти дві стіни, які мають спільний кут, одна стіна буде довжиною, а друга шириною. Отримані показники множите, в результаті чого ви отримаєте кількість метрів квадратних кухні.</p>
                    depends:
                      - field: property_type
                        except: [room, commercial, garage, land]

                  - name: surface_bathroom
                    type: number
                    col: col-6 col-md-4
                    label: Санвузол
                    min: 1.00
                    append:
                      button:
                        label: "<small><b>м<sup>2</sup></b></small>"
                        variant: primary
                        title: Інформаційна довідка
                        modal:
                          title: Про метричні величини
                          body: |
                            <dl>
                              <dt>Один метр (м)</dt>
                              <dd>Це 1000 мм або 100 см</dd>
                              <dt>Один метр квадратний (<small>м<sup>2</sup></small>)</dt>
                              <dd>Це площа квадрата зі стороною один метр (1 м х 1 м)</dd>
                            </dl>
                            <p><b>Приклад</b>: Якщо ви хочете визначити кількість метрів квадратних санвузла у квартирі чи у будинку вам необхідно виміряти дві стіни, які мають спільний кут, одна стіна буде довжиною, а друга шириною. Отримані показники множите, в результаті чого ви отримаєте кількість метрів квадратних санвузла.</p>
                    depends:
                      - field: property_type
                        except: [room, commercial, garage, land]
                    
                  - name: surface_corridor
                    type: number
                    col: col-6 col-md-4
                    label: Коридор
                    min: 1.00
                    append:
                      button:
                        label: "<small><b>м<sup>2</sup></b></small>"
                        variant: primary
                        title: Інформаційна довідка
                        modal:
                          title: Про метричні величини
                          body: |
                            <dl>
                              <dt>Один метр (м)</dt>
                              <dd>Це 1000 мм або 100 см</dd>
                              <dt>Один метр квадратний (<small>м<sup>2</sup></small>)</dt>
                              <dd>Це площа квадрата зі стороною один метр (1 м х 1 м)</dd>
                            </dl>
                            <p><b>Приклад</b>: Якщо ви хочете визначити кількість метрів квадратних коридора у квартирі чи у будинку вам необхідно виміряти дві стіни, які мають спільний кут, одна стіна буде довжиною, а друга шириною. Отримані показники множите, в результаті чого ви отримаєте кількість метрів квадратних коридора.</p>
                    depends:
                      - field: property_type
                        except: [room, commercial, garage, land]

                  - name: surface_othres
                    type: number
                    col: col-6 col-md-4
                    label: Інше
                    min: 0.00
                    append:
                      button:
                        label: "<small><b>м<sup>2</sup></b></small>"
                        variant: primary
                        title: Інформаційна довідка
                        modal:
                          title: Про метричні величини
                          body: |
                            <dl>
                              <dt>Один метр (м)</dt>
                              <dd>Це 1000 мм або 100 см</dd>
                              <dt>Один метр квадратний (<small>м<sup>2</sup></small>)</dt>
                              <dd>Це площа квадрата зі стороною один метр (1 м х 1 м)</dd>
                            </dl>
                            <p><b>Приклад</b>: Якщо ви хочете визначити кількість метрів квадратних іншої площі у квартирі чи у будинку вам необхідно виміряти дві стіни, які мають спільний кут, одна стіна буде довжиною, а друга шириною. Отримані показники множите, в результаті чого ви отримаєте кількість метрів квадратних іншої площі.</p>
                    depends:
                      - field: property_type
                        except: [room, commercial, garage, land]

                  - name: location_room
                    type: select
                    col: col-12 col-md-8
                    label: Розташування кімнати
                    placeholder: Оберіть де знаходиться кімната...
                    options:
                      - value: room_apartment
                        label: Кімната у квартирі
                      - value: room_house
                        label: Кімната у будинку
                      - value: room_hostel
                        label: Кімната у гуртожитку
                      - value: room_hotel
                        label: Кімната у гостинниці
                    depends:
                      - field: property_type
                        values: [room]

              - class: row
                fields:
                  - name: surface_land_paragraph
                    type: paragraph
                    class: font-weight-bold
                    label: "Площа земельної ділянки в м²"
                    col: col-12
                    depends:
                      - field: has_land
                        values: [true]
                        logic: or
                      - field: property_type
                        values: [house, land]

              - class: row
                fields:
                  - name: surface_land
                    type: number
                    required:
                      - field: property_type
                        values: [house, land]
                    label: Площа землі
                    placeholder: Від 5 м² і більше
                    min: 5.00
                    max: 999999999.00
                    col: col-12 col-md-5
                    append:
                      button:
                        label: "<small><b>м<sup>2</sup></b></small>"
                        variant: primary
                        title: Інформаційна довідка
                        modal:
                          title: Про метричні величини для землі
                          body: |
                            <dl>
                              <dt>Один метр (м)</dt>
                                <dd>Це 1000 мм або 100 см</dd>
                              <dt>Один метр квадратний (<small>м<sup>2</sup></small>)</dt>
                                <dd>Це площа квадрата зі стороною один метр (1 м х 1 м)</dd>
                              <dt>Один гекта́р (га)</dt>
                                <dd>Це площа квадрата зі стороною 100 м (100 м х 100 м) і&nbsp;дорівнює 10&nbsp;000 <small>м<sup>2</sup></small> або 100 арів</dd>
                              <dt>Один ар (a) (також відомий як "со́тка")</dt>
                                <dd>Це площа квадрата зі стороною 10 м (10 м х 10 м), 1&nbsp;ар&nbsp;дорівнює 100 <small>м<sup>2</sup></small> або 0,01 гекта́ра</dd>
                            </dl>
                            <p><b>Приклад</b>: Якщо у вас 10 арів (у народі кажуть "со́ток"), а у офіційних документах пишуть 0.1000 га (гектара) то це буде 1000&nbsp;<small>м<sup>2</sup></small>.</p>
                    depends:
                      - field: has_land
                        values: [true]
                        logic: or
                      - field: property_type
                        values: [house, land]
                    validation:
                      required: Ви не ввели загальну площу м2 землі. Будь ласка введіть загальну площу м2 землі.
                      min: Тут може бути мінімум 5 м².
                      max: Тут може бути максимум 999999999 м².
                    helper: Введіть не менше 5 м².

                  - name: cadastral_number
                    type: text
                    required:
                      - field: property_type
                        values: [house, land]
                    label: Кадастровий номер
                    placeholder: XXXXXXXXXX:XX:XXX:XXXX
                    pattern: ^[0-9]{10,10}:[0-9]{2,2}:[0-9]{3,3}:[0-9]{4,4}
                    minlength: 22
                    maxlength: 22
                    col: col-12 col-md-7
                    append:
                      button:
                        label: "<b>i</b>"
                        variant: primary
                        title: Інформаційна довідка
                        modal:
                          title: Про кадастровий номер
                          body: |
                            <p><b>Кадастровий номер земельної ділянки</b> — це унікальний номер, якій видається Центром Державний земельний кадастр.</p>
                            <p>Відповідно до статті 1 закону "Про Державний земельний кадастр", <b>кадастровий номер</b>це індивідуальна й унікальна для території України послідовність цифр і знаків, яка присвоюється земельній ділянці під час її державної реєстрації і зберігається за нею протягом усього часу існування.</p>
                            <p><b>Приклад кадастрового номера</b>: 8000000000:69:033:0001</p>
                    depends:
                      - field: has_land
                        values: [true]
                        logic: or
                      - field: property_type
                        values: [house, land]
                    validation:
                      pattern: Це поле має містити щонайменше 22 символи, а це цифри і вертикальні дві крапки ':' поміж цифр
                    helper: Введіть кадастровий номер земельної ділянки.

              - class: row
                fields:
                  - name: rent_paragraph
                    type: paragraph
                    class: font-weight-bold
                    label:
                      text: Про період і оплату оренди та комунальні послуги
                      depends:
                        - field: action_type
                          values: [rent_free]
                          text: Про оплату комунальних послуг
                    col: col-12
                    depends:
                      - field: action_type
                        values: [rent, rent_free]

              - class: row
                auto: true
                fields:
                  - name: period_rent
